name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ilro
          POSTGRES_USER: ilro
          POSTGRES_PASSWORD: ilro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: 빌드 + 테스트
        run: ./gradlew build