name: Backend CI

on:
  # develop·main으로 들어가는 PR을 올리거나 커밋을 추가할 때
  pull_request:
    branches: [develop, main]
  # develop·main에 머지됐을 때
  push:
    branches: [develop, main]
  # Actions 탭에서 수동 실행
  workflow_dispatch:

concurrency:
  # 같은 브랜치의 이전 실행 정리: PR은 취소하고 최신만 검사, 머지(push)는 배포 중단 없이 순서대로
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # 코드 읽기만 허용
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 테스트용 PostgreSQL (로컬 docker-compose.yml과 같은 값)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ilro
          POSTGRES_USER: ilro
          POSTGRES_PASSWORD: ilro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # application-local.yml의 기본 DB 값(localhost:5432/ilro)을 그대로 사용
      SPRING_PROFILES_ACTIVE: local

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        # Windows에서 커밋한 gradlew는 Linux에서 실행 권한이 없을 수 있음
        run: chmod +x gradlew

      - name: 빌드 + 테스트
        # 컴파일, 테스트(contextLoads 포함: Flyway·JPA 시작 검증)
        run: ./gradlew build

  # develop·main에 머지됐을 때만: 빌드·테스트 통과 → 이미지 ECR 업로드 → EC2 배포
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # main → prod, develop → dev (AWS 역할이 이 환경 이름일 때만 로그인 허용)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      # OIDC 토큰 발급 (AWS 키 없이 로그인)
      id-token: write
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: ilro-backend
      INSTANCE_ID: i-0e74ebb9a451ac421

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AWS 로그인 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::726228202300:role/ilro-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·업로드
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="$ENV_NAME-$GITHUB_SHA"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          # 같은 커밋 재실행이면 이미 올린 이미지 재사용 (태그 변경 불가 설정이라 다시 못 올림)
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "이미 있는 이미지 사용: $IMAGE"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: EC2 배포 (SSM)
        run: |
          # deploy.sh를 그대로 보내서 EC2에서 실행
          jq -n --arg script "$(base64 -w0 deploy/deploy.sh)" --arg env "$ENV_NAME" --arg image "$IMAGE" \
            '{commands: ["echo \($script) | base64 -d > /tmp/ilro-deploy.sh", "bash /tmp/ilro-deploy.sh \($env) \($image)"]}' > params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ilro $ENV_NAME ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령: $COMMAND_ID"

          # 끝날 때까지 기다림 (5초마다, 최대 6분)
          STATUS=Pending
          for _ in $(seq 1 72); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          # EC2 쪽 출력 그대로 보여줌
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "결과: $STATUS"
          test "$STATUS" = Success

      - name: 외부 주소 확인
        run: |
          HOST=$([ "$ENV_NAME" = prod ] && echo api || echo dev-api)
          curl -fsS --retry 5 --retry-delay 3 "https://$HOST.illo.ai.kr/actuator/health"
