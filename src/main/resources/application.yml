# 항상 쓰임
# 모든 환경의 공통설정

spring:
  application:
    name: ilro-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      pool:
        # 스케줄 작업 스레드 수 - AI 재확인·제안 만료·알림 발송(BE-14)이 서로 기다리지 않게
        size: 3

server:
  port: ${SERVER_PORT:8080}
  # 프록시(로드밸런서·nginx) 뒤에서 X-Forwarded-For의 실제 고객 IP를 씀 (인증번호 IP별 발송 제한)
  # 내부망 프록시가 보낸 헤더만 믿음 (Tomcat RemoteIpValve 기본값)
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    # 인증번호 해시(HMAC) 비밀값 - DB가 새어도 6자리 번호를 되돌리지 못하게. 운영(prod)은 환경변수 필수
    code-pepper: ${AUTH_CODE_PEPPER:local-only-code-pepper}
  sms:
    # 발신번호 (솔라피에 등록된 번호, 숫자만)
    sender: ${SMS_SENDER_NUMBER:}
    solapi:
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      base-url: https://api.solapi.com
  intake:
    # 고객이 동의하는 약관 버전 - 약관을 바꾸면 이 값만 올림, 이전 버전 동의로는 새 상담을 시작할 수 없음
    terms-version: ${INTAKE_TERMS_VERSION:2026-10-v1}
    # 고객 접수 화면 주소 (로컬 기본값, 서버는 Parameter Store)
    base-url: ${INTAKE_LINK_BASE_URL:http://localhost:3000}
  ai:
    # 고객 메시지가 오면 AI 서버에 문의 분석을 맡김 (명세 6장)
    enabled: ${AI_ENABLED:true}
    # fake: AI 서버 없이 가짜 답변 (로컬·프론트 개발, AI 서버 연결 전) / http: 실제 AI 서버
    mode: ${AI_MODE:fake}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    # AI 서버와 같이 쓰는 내부 키 (X-Internal-Key)
    internal-key: ${AI_INTERNAL_KEY:local-only-internal-key}
    # 같은 입력은 최초 포함 최대 2회, 시도당 30초, 전체 60초 (10/26 결정)
    attempt-timeout: 30s
    total-budget: 60s
    # 답이 없는 고객 메시지를 다시 확인하는 간격 (서버 재시작·대기열 가득 참 대비)
    sweep-interval: PT1M
  photo:
    # 사진 버킷 - 서버(dev·prod)는 Parameter Store PHOTO_BUCKET, 로컬·테스트는 가짜 저장소라 비워도 됨
    bucket: ${PHOTO_BUCKET:}
    region: ap-northeast-2
    # S3 업로드 주소 유효시간 - 이 안에 올리기 시작해야 함
    upload-ttl: 5m
    # 사진 보기 주소 유효시간 - AI 호출 전체 대기(60초)보다 넉넉하게
    view-ttl: 5m
    # AI 서버에 보내는 사진 주소 유효시간 (명세 6.2) - AI 재시도(최대 60초)·대기열 재요청보다 넉넉하게
    ai-ttl: 10m
  booking:
    # 방문 가능 시간 후보 간격 - 영업 시작부터 이 간격마다 (C-12)
    slot-step: 30m
    # 기한이 지난 시간 변경 제안을 EXPIRED로 바꾸는 간격 (명세 5.3, BE-16) - 수락할 때도 기한을 다시 봄
    proposal-expiry-interval: PT1M
  map:
    # 같은 두 지점(방향 구분)의 자동차 이동시간은 이 시간 동안 지도에 다시 묻지 않음 (BE-10)
    travel-cache-ttl: 6h
    # 이동시간을 얻지 못한 구간(셀 수 없다는 답·지도 장애)은 이 시간만 기억 - 장애 때 같은 구간을 계속 묻지 않고 곧 다시 시도
    failure-cache-ttl: 1m
    # 기억하는 구간 수 - 넘으면 오래 안 쓴 구간부터 지움
    travel-cache-size: 10000
  kakao:
    # 카카오 REST API 키 - 주소·지역 검색(BE-15), 나중에 길찾기도 같은 키
    # 서버(dev·prod)는 Parameter Store, 로컬은 .env (비어 있으면 로컬·테스트는 가짜 검색)
    rest-api-key: ${KAKAO_REST_API_KEY:}
    # 카카오 로컬 API 주소 (주소·지역 검색 - 카카오 상품 이름, 우리 local 프로필과 무관)
    local-base-url: https://dapi.kakao.com
    # 카카오모빌리티 자동차 길찾기 (이동시간) - 키는 위 REST API 키 그대로
    navi-base-url: https://apis-navi.kakaomobility.com

  access-log:
    # 고객정보 접근 기록을 읽을 CloudWatch 로그 그룹 (O-09, BE-19) - 서버(dev·prod)만 씀, 프로필 파일에서 정함
    # 로컬·테스트는 이 서버가 남긴 기록을 메모리에서 읽음
    log-group: ""
    region: ap-northeast-2
  privacy:
    # 보관기간(일)이 지나서 지우는 삭제 요청(RETENTION_EXPIRED)의 기준 (O-09, BE-19)
    # 팀이 보관기간을 정하기 전까지 비워 둠 - 비어 있으면 그 근거의 삭제 요청은 실행하지 않고 422
    retention-days: ${PRIVACY_RETENTION_DAYS:}

  push:
    # Web Push(VAPID) 키 한 쌍 (B-27, BE-14) - npx web-push generate-vapid-keys
    # 서버(dev·prod)는 Parameter Store, 비어 있거나 짝이 안 맞으면 서버가 뜨지 않음 (배포 실패 → 자동 롤백)
    # 로컬은 .env - 비어 있으면 공개키 API가 503이고 푸시는 로그만 남김
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # 푸시 서버(구글·애플 등)가 문제 있을 때 연락할 곳 (VAPID sub, https 또는 mailto) - 기본은 고객 접수 화면 주소
    vapid-subject: ${VAPID_SUBJECT:${app.intake.base-url}}
  notification:
    # 쌓인 알림(문자·푸시)을 보내는 간격 (명세 5.10) - 예약 저장이 끝난 뒤 이 간격 안에 나감
    dispatch-interval: PT10S
    # 한 번에 보내는 알림 수 - 남은 것은 다음 차례에
    dispatch-batch-size: 50
