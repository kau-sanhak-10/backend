# 프로필이 prod일 때 쓰임
# 운영 서버 (AWS, main 머지 시 배포, 실제 고객 사용)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      # 로그 한 줄을 JSON 하나로 - CloudWatch에서 requestId·actor로 검색, 오류 스택도 한 덩어리로
      console: logstash
  level:
    com.ilro: info
app:
  auth:
    # 기본값 없음 - 환경변수가 없으면 서버가 뜨지 않음
    code-pepper: ${AUTH_CODE_PEPPER}
  intake:
    base-url: ${INTAKE_LINK_BASE_URL}
