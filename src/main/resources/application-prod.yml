# 프로필이 prod일 때 쓰임
# 운영 서버 (AWS, main 머지 시 배포, 실제 고객 사용)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      # 로그 한 줄을 JSON 하나로 - CloudWatch에서 requestId·actor로 검색, 오류 스택도 한 덩어리로
      console: logstash
  level:
    com.ilro: info
app:
  auth:
    # 기본값 없음 - 환경변수가 없으면 서버가 뜨지 않음
    code-pepper: ${AUTH_CODE_PEPPER}
  ai:
    # 운영은 실제 AI 서버만 - 환경변수로 바꾸지 않음 (가짜 AI 클라이언트는 prod 프로필에서 만들지 않음)
    # 주소·내부 키는 환경변수 필수
    mode: http
    base-url: ${AI_BASE_URL}
    internal-key: ${AI_INTERNAL_KEY}
  intake:
    base-url: ${INTAKE_LINK_BASE_URL}
