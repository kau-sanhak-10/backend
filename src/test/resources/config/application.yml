# 테스트에서만 쓰임 (src/main의 application.yml 위에 덮어씀)
# 고객 메시지마다 AI 분석이 따로 스레드에서 돌면 결과가 흔들리므로 꺼 둠
# AI 분석 테스트는 AiAnalysisService를 직접 부르거나 이 값을 켜서 확인
app:
  ai:
    enabled: false
  # 알림 발송기가 테스트 도중 저절로 돌지 않게 - 테스트는 발송기를 직접 부름
  notification:
    dispatch-interval: PT1H
  # 제안 만료 작업이 테스트 도중 저절로 돌지 않게 - 테스트는 ProposalExpiryJob을 직접 부름
  booking:
    proposal-expiry-interval: PT1H
# 테스트 클래스마다 설정(@MockitoBean 등)이 다르면 스프링이 컨텍스트를 따로 띄우고 캐시에 남겨 둠
# 컨텍스트마다 연결 10개(기본값)를 잡고 있으면 Postgres 최대 연결(100)을 넘어 'too many clients'
# 동시성 테스트도 스레드 2개 + 테스트 본문이라 5개면 충분
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
