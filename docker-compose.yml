name: ilro

services:
  postgres:
    image: postgres:17
    container_name: ilro-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ilro
      POSTGRES_USER: ilro
      POSTGRES_PASSWORD: ilro
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: